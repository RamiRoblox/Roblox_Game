name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Selene + StyLua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Instalar herramientas (Rokit)
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: true

      - name: Selene
        run: selene src

      - name: StyLua
        run: stylua --check src
